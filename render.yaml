services:
  # 1. Express Backend Web Service
  - type: web
    name: ai-fridge-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false # User will be prompted to enter this key on Render dashboard
      - key: PORT
        value: 5000

  # 2. React Frontend Static Site
  - type: static
    name: ai-fridge-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-fridge-backend
          property: host
